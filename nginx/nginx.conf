events {
    worker_connections 1024;
}

http {
    # ─── Redirect HTTP → HTTPS ───────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ─── HTTPS + mTLS ingestion endpoint ────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        # TLS 1.3 only
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Server certificate
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # mTLS: validate client certificates signed by our CA
        ssl_client_certificate /etc/nginx/ssl/ca.crt;
        ssl_verify_client      on;
        ssl_verify_depth       2;

        # OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        # Pass the client cert CN to the orchestrator for double-validation
        proxy_set_header X-Client-CN   $ssl_client_s_dn_cn;
        proxy_set_header X-Real-IP     $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host          $host;

        # Proxy to orchestrator
        location / {
            proxy_pass         http://orchestrator:8080;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
        }

        # Health check endpoint (no mTLS required — override ssl_verify_client)
        location /health {
            ssl_verify_client off;
            proxy_pass http://orchestrator:8080/health;
        }
    }
}
