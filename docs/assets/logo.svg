<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">heiLLMpot logo</title>
  <desc id="desc">A dark banner logo for heiLLMpot with a shield, circuit trace, and wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0e1f2f"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
